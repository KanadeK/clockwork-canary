[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clockwork-canary"
version = "0.1.1"
description = "Audit scheduled GitHub Actions for DST surprises, load spikes, collisions, and runner-minute risk."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = [
  "cron",
  "github-actions",
  "scheduler",
  "static-analysis",
  "timezone",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "tzdata>=2026.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "build==1.6.0",
  "coverage[toml]>=7.10",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "setuptools==84.0.0",
  "types-PyYAML>=6.0.12",
  "wheel==0.47.0",
]

[project.scripts]
clockwork-canary = "clockwork_canary.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/clockwork-canary"
Documentation = "https://github.com/KanadeK/clockwork-canary#readme"
Issues = "https://github.com/KanadeK/clockwork-canary/issues"
Changelog = "https://github.com/KanadeK/clockwork-canary/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clockwork_canary"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["clockwork_canary"]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = true
