name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest --cov=clockwork_canary --cov-branch --cov-report=term-missing

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python scripts/verify.py
      - uses: actions/upload-artifact@v6
        with:
          name: clockwork-canary-release-candidate
          path: release/
          if-no-files-found: error

  action-smoke:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./
        with:
          path: examples/healthy-repo
          fail-on: warning
          format: json
          output: clockwork-canary-report.json
      - run: python -c "import json; data=json.load(open('clockwork-canary-report.json', encoding='utf-8')); assert data['summary']['findings'] == 0"
