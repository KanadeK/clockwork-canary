name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python scripts/verify.py
      - name: Check tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'from clockwork_canary import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --title "Clockwork Canary $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES_v0.1.0.md
